<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaiceControl - Análisis Microeconómico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Cache busting to force light theme -->
    <link rel="stylesheet" href="style.css?v=8.2.1">
    <link rel="manifest" href="manifest.json">
    <script>
        // Force update service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=8.2.1').then(reg => {
                reg.update();
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-chart-line"></i></div>
                <h2>SaiceControl</h2>
                <p>Análisis Premium</p>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-target="tab-perfecta"><i class="fa-solid fa-scale-balanced"></i><span>Comp. Perfecta</span></button>
                <button class="nav-item" data-target="tab-imperfecta"><i class="fa-solid fa-chess-knight"></i><span>Monopolio</span></button>
                <button class="nav-item" data-target="tab-elasticidad"><i class="fa-solid fa-compress-alt"></i><span>Elasticidad</span></button>
                <button class="nav-item" data-target="tab-equilibrio"><i class="fa-solid fa-bullseye"></i><span>Equilibrio</span></button>
                <button class="nav-item" data-target="tab-indiferencia"><i class="fa-solid fa-code-compare"></i><span>Indiferencia</span></button>
                <button class="nav-item" data-target="tab-capacidad"><i class="fa-solid fa-industry"></i><span>Producción</span></button>
                <button class="nav-item" data-target="tab-guia"><i class="fa-solid fa-graduation-cap"></i><span>Defensa</span></button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Panel de Control</h1>
                <div class="topbar-actions no-print">
                    <button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                    <button class="btn btn-primary"><i class="fa-solid fa-file-word"></i> Word</button>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- TAB 1: Competencia Perfecta -->
                <section id="tab-perfecta" class="tab-section active">
                    <div class="paper-container">
                        <h3 class="paper-title">EJERCICIO 1. Saice Tarijeño (Editable)</h3>
                        <div class="table-responsive">
                            <table class="paper-table">
                                <thead><tr><th>Precio</th><th>Demanda</th><th>Oferta</th><th class="no-print">Acción</th></tr></thead>
                                <tbody id="table-body">
                                    <tr><td><input type="number" class="t-price" value="12"></td><td><input type="number" class="t-dem" value="12000"></td><td><input type="number" class="t-sup" value="10000"></td><td class="no-print"><button class="btn-icon delete-row" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                                    <tr><td><input type="number" class="t-price" value="12.5"></td><td><input type="number" class="t-dem" value="11680"></td><td><input type="number" class="t-sup" value="11500"></td><td class="no-print"><button class="btn-icon delete-row" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                                    <tr><td><input type="number" class="t-price" value="13"></td><td><input type="number" class="t-dem" value="11500"></td><td><input type="number" class="t-sup" value="11750"></td><td class="no-print"><button class="btn-icon delete-row" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="no-print" style="margin-bottom:1rem; display:flex; gap:10px;">
                            <button id="add-row" class="btn btn-secondary btn-sm" style="color:#000; border-color:#000;"><i class="fa-solid fa-plus"></i> Añadir Fila</button>
                        </div>
                        <div class="paper-text">
                            Costo Variable: <input type="number" id="inp-porcentaje-cv" value="35" class="inline-input"> 
                            <select id="inp-cv-type" class="inline-select"><option value="percent">%</option><option value="absolute">bs</option></select>
                            | Costo Fijo: <input type="number" id="inp-cf" value="7000" class="inline-input">bs
                        </div>
                    </div>
                    <button id="btn-resolver" class="btn btn-primary btn-lg" style="width:100%;"><i class="fa-solid fa-wand-magic-sparkles"></i> Resolver</button>

                    <div id="resolution-container" style="display:none; margin-top:2rem;">
                        <div class="card step-card">
                            <h3>Resultados del Análisis</h3>
                            <div class="math-formulas" id="math-demanda"></div>
                            <div class="math-formulas" id="math-equilibrio"></div>
                            <div class="math-formulas" id="math-utilidad"></div>
                            <div class="chart-container">
                                <div style="position:absolute; top:10px; left:10px; font-weight:800; color:#000;">INGRESOS (Bs)</div>
                                <div style="position:absolute; bottom:10px; right:10px; font-weight:800; color:#000;">CANTIDAD (Q)</div>
                                <canvas id="chart-utilidad-custom"></canvas>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- TAB 2: Monopolio -->
                <section id="tab-imperfecta" class="tab-section">
                    <div class="paper-container">
                        <h3 class="paper-title">Análisis de Monopolio</h3>
                        <table class="paper-table">
                            <thead><tr><th>Precio</th><th>Demanda</th><th class="no-print">Acción</th></tr></thead>
                            <tbody id="table-body-imp">
                                <tr><td><input type="number" class="t-price-imp" value="10"></td><td><input type="number" class="t-dem-imp" value="20000"></td><td class="no-print"><button class="btn-icon delete-row-imp" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                                <tr><td><input type="number" class="t-price-imp" value="12"></td><td><input type="number" class="t-dem-imp" value="18000"></td><td class="no-print"><button class="btn-icon delete-row-imp" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                            </tbody>
                        </table>
                        <button id="add-row-imp" class="btn btn-secondary btn-sm" style="margin-top:10px;"><i class="fa-solid fa-plus"></i> Fila</button>
                        <div class="paper-text" style="margin-top:15px;">
                            CV: <input type="number" id="inp-cv-imp" value="3" class="inline-input"> 
                            CF: <input type="number" id="inp-cf-imp" value="7000" class="inline-input">
                            <input type="hidden" id="inp-cv-imp-type" value="absolute">
                        </div>
                    </div>
                    <button id="btn-resolver-imp" class="btn btn-primary btn-lg" style="width:100%;"><i class="fa-solid fa-calculator"></i> Calcular Monopolio</button>
                    <div id="resolution-container-imp" style="display:none; margin-top:2rem;">
                        <div class="card step-card">
                            <div class="math-formulas" id="math-reg-imp"></div>
                            <div class="math-formulas" id="math-9-imp"></div>
                            <div class="chart-container"><canvas id="chart-imperfecta-custom"></canvas></div>
                        </div>
                    </div>
                </section>

                <!-- TAB 3: Elasticidad -->
                <section id="tab-elasticidad" class="tab-section">
                    <div class="paper-container">
                        <h3 class="paper-title">Elasticidad</h3>
                        <table class="paper-table">
                            <thead><tr><th>Precio</th><th>Demanda</th><th class="no-print">Acción</th></tr></thead>
                            <tbody id="table-body-elas">
                                <tr><td><input type="number" class="t-elas-p" value="20"></td><td><input type="number" class="t-elas-q" value="100"></td><td class="no-print"><button class="btn-icon delete-row-elas" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                                <tr><td><input type="number" class="t-elas-p" value="25"></td><td><input type="number" class="t-elas-q" value="80"></td><td class="no-print"><button class="btn-icon delete-row-elas" style="color:red;"><i class="fa-solid fa-trash"></i></button></td></tr>
                            </tbody>
                        </table>
                        <button id="add-row-elas" class="btn btn-secondary btn-sm" style="margin-top:10px;"><i class="fa-solid fa-plus"></i> Fila</button>
                    </div>
                    <button id="calc-elasticidad" class="btn btn-primary btn-lg" style="width:100%;"><i class="fa-solid fa-calculator"></i> Calcular</button>
                    <div id="res-elasticidad" style="display:none; margin-top:1rem;" class="math-formulas" id="math-elasticidad"></div>
                </section>

                <!-- Resto de secciones (Ocultas para simplificar carga inicial) -->
                <section id="tab-equilibrio" class="tab-section"></section>
                <section id="tab-indiferencia" class="tab-section"></section>
                <section id="tab-capacidad" class="tab-section"></section>
                <section id="tab-guia" class="tab-section"></section>
            </div>
        </main>
    </div>
    <script src="script.js?v=8.2.1"></script>
</body>
</html>
